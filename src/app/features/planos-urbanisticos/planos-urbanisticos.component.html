<section class="section">
  <div class="container">
    <h1>{{ copy().title }}</h1>
    <p class="lead">{{ copy().intro }}</p>
    <div class="card section-content">
      @if (imageAvailable()) {
        <figure class="cadastral-figure">
          <img
            class="cadastral-image"
            [src]="asset.src"
            [alt]="asset.alt[locale()]"
            (error)="onImageError()"
          />
          <figcaption class="cadastral-caption">{{ asset.caption[locale()] }}</figcaption>
          <p class="cadastral-attribution">{{ asset.attribution }}</p>
        </figure>
      } @else {
        <p class="fallback-message">{{ asset.fallback[locale()] }}</p>
      }
    </div>
  </div>
</section>
